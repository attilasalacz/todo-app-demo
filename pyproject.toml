[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "todo-app-demo"
version = "0.1.0"
description = "A simple Streamlit todo app for coding-agent demonstrations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.setuptools]
py-modules = ["app", "todo_store"]
